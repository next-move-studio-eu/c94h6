    <script>
      (function () {
        try {
          const saved = localStorage.getItem('editorThemeMode');
          document.documentElement.setAttribute('data-mode', (saved === 'dark' || saved === 'light') ? saved : 'light');
        } catch (_) {
          document.documentElement.setAttribute('data-mode', 'light');
        }
      })();
    </script>
