# cargo-deny: disallow GPL/AGPL; allow common permissive licenses (+ EUPL for this crate).
# Used by audit/credits.sh for editor (Tauri) license and advisory checks.
#
# Advisories: `vulnerability = "deny"` was removed — vulnerabilities always fail the check.
# `unmaintained` must be one of: all | workspace | transitive | none (not "warn"/"deny").

[licenses]
unused-allowed-license = "allow"
confidence-threshold = 0.8
allow = [
    "EUPL-1.2",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
]

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
# Scope for unmaintained advisories: all (strictest) | workspace | transitive | none
unmaintained = "workspace"
yanked = "deny"
ignore = []
